[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
# Use Corepack to pick up Yarn 4 from package.json's packageManager field.
# `--immutable` is Yarn 4's equivalent of `--frozen-lockfile`.
cmds = [
  "corepack enable",
  "corepack prepare --activate",
  "yarn install --immutable"
]

[phases.build]
cmds = ["yarn build"]

[start]
cmd = "node dist/server.js"
